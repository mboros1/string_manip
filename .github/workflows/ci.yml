name: C Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsimde-dev
    
    - name: Build project
      run: |
        make all
    
    - name: Run all tests
      if: success()
      run: |
        make all_tests

    - name: Run tests on the scalar backend
      run: |
        make check_backends

    - name: Run tests with small pools
      run: |
        make check_small

    - name: Check the library imports only memcpy/memset/memmove/memcmp
      run: |
        make check_freestanding
