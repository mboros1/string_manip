name: C Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsimde-dev
    
    - name: Build project
      run: |
        make all
    
    - name: Run all tests
      if: success()
      run: |
        ./bin/test_faf_string
        ./bin/test_faf_string_mem
        ./bin/test_faf_string_strsplit
        ./bin/test_faf_string_cmp
