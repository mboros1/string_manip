name: C Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsimde-dev
    
    - name: Create directories
      run: |
        mkdir -p bin
        mkdir -p obj
    
    - name: Build test framework
      run: |
        make CC=gcc CFLAGS="-O0 -g -Wall" TEST_FLAGS="-O0 -g -Wall" test_framework
    
    - name: Build string split test
      run: |
        make CC=gcc CFLAGS="-O0 -g -Wall" TEST_FLAGS="-O0 -g -Wall" bin/test_faf_string_strsplit
    
    - name: Run string split test
      run: |
        ./bin/test_faf_string_strsplit
    
    - name: Build all tests
      if: success()
      run: |
        make CC=gcc CFLAGS="-O0 -g -Wall" TEST_FLAGS="-O0 -g -Wall" test
    
    - name: Run all tests
      if: success()
      run: |
        ./bin/test_faf_string
        ./bin/test_faf_string_mem
        ./bin/test_faf_string_strsplit
        ./bin/test_faf_string_cmp
